# PERFIL dev: base H2 en archivo (./data/ dentro del microservicio).
server:
  port: 8085
management:
  endpoints:
    web:
      exposure:
        # Solo lo necesario para monitoreo. NO se expone "*": endpoints como
        # heapdump / env / configprops pueden filtrar secretos (ej: el JWT secret).
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
spring:
  datasource:
    # H2 en ARCHIVO: los datos sobreviven a reiniciar el servicio.
    # (Para empezar de cero, borrar la carpeta ./data del microservicio.)
    url: jdbc:h2:file:./data/administraciondb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
