# PERFIL docker (produccion): base MySQL, RabbitMQ y registry por nombre de servicio.
# Las claves vienen de variables de entorno (docker-compose + archivo .env), no se escriben aca.
server:
  port: 8085
management:
  endpoints:
    web:
      exposure:
        # Solo lo necesario para monitoreo. NO se expone "*": endpoints como
        # heapdump / env / configprops pueden filtrar secretos (ej: el JWT secret).
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
eureka:
  client:
    service-url:
      defaultZone: http://registry:8761/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/administraciondb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MYSQL_ROOT_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
