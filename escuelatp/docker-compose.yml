# =====================================================================
# docker-compose.yml  -  levanta TODO el sistema con las imagenes de
# Docker Hub (maxmegafuego/escuelatp-*). No hay que compilar ni crear .env.
#
#   docker compose up -d
#
# Cada microservicio con base de datos (auth, alumno, cursos, administracion)
# tiene su PROPIO contenedor MySQL, con su usuario, clave, base y volumen.
#
# Los valores por defecto son SOLO PARA DEMO. Para usar otros, crear un .env
# (ver .env.example): JWT_SECRET, RABBITMQ_*, *_DB_PASSWORD, *_DB_ROOT_PASSWORD.
#
# Para compilar desde el codigo fuente en vez de bajar las imagenes:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
# =====================================================================
name: escuelatp

services:

  # ---------- Bases de datos (una por microservicio) ----------
  auth-db:
    image: mysql:8.4
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=64M", "--max-connections=50"]
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:-root_auth_pass}
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
      MYSQL_DATABASE: auth_database
    ports:
      - "3307:3306"     # para mirar la base desde afuera (Workbench/DBeaver)
    volumes:
      - auth_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  alumno-db:
    image: mysql:8.4
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=64M", "--max-connections=50"]
    environment:
      MYSQL_ROOT_PASSWORD: ${ALUMNO_DB_ROOT_PASSWORD:-root_alumno_pass}
      MYSQL_USER: alumno_user
      MYSQL_PASSWORD: ${ALUMNO_DB_PASSWORD:-alumno_pass}
      MYSQL_DATABASE: alumnos_database
    ports:
      - "3308:3306"     # para mirar la base desde afuera (Workbench/DBeaver)
    volumes:
      - alumno_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  cursos-db:
    image: mysql:8.4
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=64M", "--max-connections=50"]
    environment:
      MYSQL_ROOT_PASSWORD: ${CURSOS_DB_ROOT_PASSWORD:-root_cursos_pass}
      MYSQL_USER: cursos_user
      MYSQL_PASSWORD: ${CURSOS_DB_PASSWORD:-cursos_pass}
      MYSQL_DATABASE: cursos_database
    ports:
      - "3309:3306"     # para mirar la base desde afuera (Workbench/DBeaver)
    volumes:
      - cursos_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  administracion-db:
    image: mysql:8.4
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=64M", "--max-connections=50"]
    environment:
      MYSQL_ROOT_PASSWORD: ${ADMIN_DB_ROOT_PASSWORD:-root_admin_pass}
      MYSQL_USER: administracion_user
      MYSQL_PASSWORD: ${ADMIN_DB_PASSWORD:-admin_pass}
      MYSQL_DATABASE: administracion_database
    ports:
      - "3310:3306"     # para mirar la base desde afuera (Workbench/DBeaver)
    volumes:
      - administracion_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # ---------- Mensajeria ----------
  rabbitmq:
    image: rabbitmq:management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-escuela}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-escuela}
    ports:
      - "5672:5672"
      - "15672:15672"   # panel: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ---------- Infraestructura Spring Cloud ----------
  registry:
    image: ${DOCKERHUB_USER:-maxmegafuego}/escuelatp-registry:${TAG:-latest}
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    ports:
      - "8761:8761"     # Eureka: http://localhost:8761
    restart: unless-stopped

  configserver:
    image: ${DOCKERHUB_USER:-maxmegafuego}/escuelatp-configserver:${TAG:-latest}
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx320m"
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - registry
    # El Config Server clona el repo de properties al arrancar: recien cuando
    # responde, los demas servicios pueden pedirle su configuracion.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888/application/default > /dev/null || bash -c 'exec 3<>/dev/tcp/localhost/8888'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  adminserver:
    image: ${DOCKERHUB_USER:-maxmegafuego}/escuelatp-adminserver:${TAG:-latest}
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx320m"
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8090:8090"     # Spring Boot Admin: http://localhost:8090
    depends_on:
      - registry
    restart: unless-stopped

  # ---------- Microservicios ----------
  auth:
    image: ${DOCKERHUB_USER:-maxmegafuego}/escuelatp-auth:${TAG:-latest}
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx320m"
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_pass}
      JWT_SECRET: ${JWT_SECRET:-e+9DTEal5y8rHiyPEyK+e9pWfQdM2qjXwlsCe/3nwmh/C7RAlhcyLIl3HbhVi8RM}
    ports:
      - "8086:8086"     # Swagger: http://localhost:8086/swagger-ui.html
    depends_on:
      configserver:
        condition: service_healthy
      auth-db:
        condition: service_healthy
    restart: on-failure

  alumno:
    image: ${DOCKERHUB_USER:-maxmegafuego}/escuelatp-alumno:${TAG:-latest}
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx320m"
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${ALUMNO_DB_PASSWORD:-alumno_pass}
      RABBITMQ_USER: ${RABBITMQ_USER:-escuela}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-escuela}
    ports:
      - "8084:8084"     # Swagger: http://localhost:8084/swagger-ui.html
    depends_on:
      configserver:
        condition: service_healthy
      alumno-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  cursos:
    image: ${DOCKERHUB_USER:-maxmegafuego}/escuelatp-cursos:${TAG:-latest}
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx320m"
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${CURSOS_DB_PASSWORD:-cursos_pass}
      RABBITMQ_USER: ${RABBITMQ_USER:-escuela}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-escuela}
    ports:
      - "8083:8083"     # Swagger: http://localhost:8083/swagger-ui.html
    depends_on:
      configserver:
        condition: service_healthy
      cursos-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  administracion:
    image: ${DOCKERHUB_USER:-maxmegafuego}/escuelatp-administracion:${TAG:-latest}
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx320m"
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${ADMIN_DB_PASSWORD:-admin_pass}
    ports:
      - "8085:8085"     # Swagger: http://localhost:8085/swagger-ui.html
    depends_on:
      configserver:
        condition: service_healthy
      administracion-db:
        condition: service_healthy
    restart: on-failure

  gateway:
    image: ${DOCKERHUB_USER:-maxmegafuego}/escuelatp-gateway:${TAG:-latest}
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx320m"
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-e+9DTEal5y8rHiyPEyK+e9pWfQdM2qjXwlsCe/3nwmh/C7RAlhcyLIl3HbhVi8RM}
    ports:
      - "8081:8081"     # unica puerta de entrada para el front
    depends_on:
      configserver:
        condition: service_healthy
    restart: on-failure

  # ---------- Front ----------
  front:
    image: ${DOCKERHUB_USER:-maxmegafuego}/escuelatp-front:${TAG:-latest}
    ports:
      - "4200:80"       # http://localhost:4200
    depends_on:
      - gateway
    restart: unless-stopped

# ---------- Volumenes independientes (uno por base) ----------
volumes:
  auth_db_data:
  alumno_db_data:
  cursos_db_data:
  administracion_db_data:
